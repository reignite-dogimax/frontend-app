<button mat-icon-button
        [matMenuTriggerFor]="menu"
        [matBadge]="store.unreadCount()"
        [matBadgeHidden]="store.unreadCount() === 0"
        matBadgeColor="warn"
        matBadgeSize="small"
        class="notification-bell"
        [attr.aria-label]="('notifications.title' | translate)">
  <mat-icon>notifications</mat-icon>
</button>

<mat-menu #menu="matMenu" class="notifications-menu" xPosition="before">
  <div class="menu-header" (click)="$event.stopPropagation()">
    <div class="menu-title">
      <mat-icon>notifications_active</mat-icon>
      <span>{{ 'notifications.title' | translate }}</span>
    </div>
    <span class="unread-badge" *ngIf="store.unreadCount() > 0">
      {{ store.unreadCount() }}
    </span>
  </div>

  <ng-container *ngIf="store.items().length; else empty">
    <div class="notifications-list">
      <button mat-menu-item 
              *ngFor="let n of store.items() | slice:0:5" 
              (click)="handleNotificationClick(n)"
              class="notification-item"
              [class.unread]="!n.isRead">
        <div class="notification-icon" [style.background]="getTypeColor(n.type)">
          <mat-icon>{{ getTypeIcon(n.type) }}</mat-icon>
        </div>
        <div class="notification-content">
          <div class="notification-type">{{ getTypeLabel(n.type) | translate }}</div>
          <div class="notification-msg">{{ n.message }}</div>
          <div class="notification-time">{{ getTimeAgo(n.createdAt) }}</div>
        </div>
        <div class="unread-dot" *ngIf="!n.isRead"></div>
      </button>
    </div>

    <div class="menu-footer" (click)="$event.stopPropagation()">
      <button mat-button 
              (click)="store.markAllAsRead(); $event.stopPropagation()"
              [disabled]="store.unreadCount() === 0"
              class="footer-btn">
        <mat-icon>done_all</mat-icon>
        {{ 'notifications.markAll' | translate }}
      </button>
      <a mat-button routerLink="/notifications" class="footer-btn view-all-btn">
        <mat-icon>open_in_new</mat-icon>
        {{ 'notifications.seeAll' | translate }}
      </a>
    </div>
  </ng-container>

  <ng-template #empty>
    <div class="empty-state">
      <mat-icon class="empty-icon">notifications_off</mat-icon>
      <p>{{ 'notifications.empty' | translate }}</p>
    </div>
  </ng-template>
</mat-menu>
